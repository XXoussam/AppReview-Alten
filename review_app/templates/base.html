<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Revue des clips{% endblock %} · Voice comms</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 8v8M20 11v2"/></svg></span>
      <span>Voice comms</span><span class="sep">/</span><span class="sub">Revue des clips</span>
    </a>
    {% if user %}
    <form method="post" action="/logout" class="who">
      <span class="chip">{{ user.username }} <small>{{ user.role }}</small></span>
      <button type="submit" class="btn ghost">Déconnexion</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
