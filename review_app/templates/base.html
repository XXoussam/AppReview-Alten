<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Revue des clips{% endblock %} · Voice comms</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Voice comms · Revue des clips</a>
    {% if user %}
    <form method="post" action="/logout" class="who">
      <span>{{ user.username }} <small>({{ user.role }})</small></span>
      <button type="submit" class="btn ghost">Déconnexion</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
